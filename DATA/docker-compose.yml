services:
  postgres:
    image: postgres:16-alpine
    container_name: retailai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retailai
    ports:
      - "5432:5432"
    volumes:
      - retailai-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d retailai"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  retailai-postgres-data:
